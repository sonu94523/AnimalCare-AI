name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend-and-ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend & ML dependencies (CPU PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r backend/requirements.txt
      - name: Run isolated pytest suite
        run: pytest -p no:cacheprovider -v backend/tests/test_app_and_ml.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install, lint, test & build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
